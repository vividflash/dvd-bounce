plugins {
    id 'java'
}

group = 'com.vividflash'
version = '1.6'

// Pinned rather than 'latest.release' so local builds resolve the same client
// every time. Only affects development: build=standard means the Plugin Hub
// replaces this file and builds against its own runelite.version.
def runeLiteVersion = '1.12.35'

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 11
    options.compilerArgs << '-Xlint:deprecation'
}
